# 论文列表。网页上按年份倒序排，同一年内按这里的书写顺序排。
#
# 默认只显示自己一作和共一的，其余折叠起来，点「显示全部」才展开。
#
# 字段说明：
#   authors     作者列表，自己的名字用 <strong> 包起来
#   venue       会议/期刊全称        venueShort  缩写
#   status      角标列表，可以挂多个：first 第一作者 / cofirst 共同一作 /
#               highlight 亮点论文。写成 [first] 或 [first, highlight]。
#               含 first 或 cofirst 的默认显示；整行不写就是没有角标。
#   image       配图路径，放在 public/assets/ 下；可省略
#   github      代码仓库；可省略
#   description 中英文摘要说明，两种语言都要填
#
# 新增一篇：复制下面任意一段（连开头的 - 一起），改内容即可。
# 标题里含冒号必须加引号。

- title: "StructDiff: A Training-Free Framework for Precise Structural Control in Remote Sensing Image Synthesis"
  authors: "<strong>B Zhao</strong>, C Yang, Q Zhou, Q Wang"
  venue: IEEE Transactions on Multimedia (T-MM)
  venueShort: T-MM
  year: "2026"
  status: [first]
  image: /assets/structdiff.png
  github: https://github.com/bxuanz/StructDiff
  description:
    en: A training-free framework for precise structural control in remote sensing image synthesis, combining multimodal prompt modulation, fixed-timestep structural conditioning, and restart refinement. Accepted by IEEE T-MM.
    zh: 面向遥感影像合成的免训练精确结构控制框架，结合多模态提示调制、固定时间步结构条件约束与重启细化策略。已被 IEEE T-MM 接收。

- title: "SHARP: Spectrum-aware Highly-dynamic Adaptation for Resolution Promotion in Remote Sensing Synthesis"
  authors: "<strong>B Zhao</strong>, Q Zhou, C Yang, J Gao, Q Wang"
  venue: ACM International Conference on Multimedia (ACM MM)
  venueShort: ACM MM
  year: "2026"
  status: [first]
  image: /assets/paper8.png
  github: https://github.com/bxuanz/SHARP
  description:
    en: Training-free large-scale remote sensing text-to-image synthesis with an RS-adapted FLUX prior and dynamic positional adaptation.
    zh: 免训练的大尺度遥感文生图方法，结合面向遥感适配的 FLUX 先验与动态位置自适应。

- title: "σ: Sigmoid Modulation for Ultra High Resolution Diffusion"
  authors: "<strong>B Zhao</strong>, Q Zhou, Y Wang, C Yang, Q Wang"
  venue: International Conference on Machine Learning (ICML)
  venueShort: ICML
  year: "2026"
  status: [first]
  image: /assets/paper7.png
  github: https://github.com/bxuanz/SigMa
  description:
    en: A sigmoid-modulated framework for stable and efficient ultra high resolution diffusion generation.
    zh: 基于 sigmoid 调制的框架，实现稳定高效的超高分辨率扩散生成。

