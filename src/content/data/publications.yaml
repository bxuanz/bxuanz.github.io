- title: Inconsistency Biases in Dynamic Data Pruning
  authors: "Q Zhou, T Yang, <strong>B Zhao</strong>, H Zhang, J Gao, Q Wang"
  venue: International Conference on Learning Representations (ICLR)
  venueShort: ICLR
  year: "2026"
  image: /assets/paper5.png
  github: https://github.com/mrazhou/RePB
  description:
    en: A study of inconsistency bias in dynamic data pruning, examining how resampling, local-window pruning, and cumulative temporal rescaling affect training dynamics.
    zh: 研究动态数据剪枝中的不一致性偏差，考察重采样、局部窗口剪枝与累积时间重缩放对训练动态的影响。

